cture migration to serverless AWS Lambda and Kubernetes EKS. How do you decide between Serverless and Containerized microservices?</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-cyan\">In-Depth Technical Response (~300 Words)</span></h4>\n          <p class=\"conv-p\">At **Epsilon**, I coordinated the backend migration to serverless **AWS Lambda** functions, **Docker** containers, and **Kubernetes EKS** clusters, directing DevOps teams to absorb **1,100,000 traffic surges with 0 failures**. Deciding between serverless architectures and containerized microservices requires analyzing workload predictability, execution duration, cold-start tolerance, and operational costs.</p><p class=\"conv-p\">For event-driven, bursty, and lightweight workloads\u2014such as processing incoming ad platform webhooks, periodic cron triggers, image thumbnail resizing, or sending Slack notifications\u2014**AWS Lambda** is the ideal solution. Serverless provides instant horizontal scaling from zero to thousands of concurrent executions without paying for idle compute, perfectly absorbing unpredictably spiky webhook traffic from Meta and Google without provisioning excess capacity.</p><p class=\"conv-p\">Conversely, for workloads that require persistent state, long-running processes, complex dependencies, or low-latency predictability\u2014such as our core **FastAPI** API gateway, multi-agent orchestration loops in **LangGraph**, and heavy **PostgreSQL** connection pooling\u2014containerized deployments on **AWS EKS** are far superior. Containers avoid the dreaded cold-start penalties of serverless environments, allow fine-grained control over GPU resources for embedding generation, and eliminate vendor lock-in. At **AdsGency AI**, the optimal architecture is a hybrid: **AWS EKS** runs the core orchestration and API layer, while **AWS Lambda** handles bursty webhook ingress and lightweight asynchronous triggers.</p>\n        </div>\n        "}, {"num": 18, "type": "verbal", "title": "Q18: When an autonomous agent crashes midway through updating a campaign across multiple external platforms, how do you handle state recovery and rollback?", "category": "Verbal Technical & Architecture", "subCategory": "Error Recovery & Dead Letter Queues", "difficulty": "Staff / MTS Interview", "search_text": "when an autonomous agent crashes midway through updating a campaign across multiple external platforms, how do you handle state recovery and rollback? error recovery & dead letter queues distributed multi-step mutations across heterogeneous external apis\u2014such as creating an ad campaign on google, an ad set on meta, and a creative on tiktok\u2014inherently lack native distributed acid transactions. if an agent worker crashes after creating the google campaign but before deploying to meta, the system is left in an inconsistent, partially deployed state.\n\nto guarantee fault tolerance at **adsgency ai**, i implement the **saga pattern** orchestrated through an explicit state machine. each multi-platform campaign deployment is broken down into discrete, idempotent steps recorded in **postgresql** with an execution ledger. before executing an external mutation, the agent writes a pending step record. upon receiving an affirmative response from the external api, the record is updated with the external platform id.\n\nif a worker crashes or an external api returns a fatal failure, the supervisor worker detects the stalled job via heartbeat timeouts in **redis**. the supervisor triggers the saga's compensating transactions: it reads the execution ledger in reverse order and issues compensating delete or pause api calls to clean up orphaned resources on google and meta. if a compensating action fails, the payload is moved to a **kafka dead letter queue (dlq)** with an automated alert to on-call engineers. this guarantees that campaigns are never left running unsupervised in partially configured states.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Interview Question</span></h4>\n          <p class=\"body-p\" style=\"font-weight: 600; font-size: 1.05rem; color: #f8fafc;\">When an autonomous agent crashes midway through updating a campaign across multiple external platforms, how do you handle state recovery and rollback?</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-cyan\">In-Depth Technical Response (~300 Words)</span></h4>\n          <p class=\"conv-p\">Distributed multi-step mutations across heterogeneous external APIs\u2014such as creating an ad campaign on Google, an ad set on Meta, and a creative on TikTok\u2014inherently lack native distributed ACID transactions. If an agent worker crashes after creating the Google campaign but before deploying to Meta, the system is left in an inconsistent, partially deployed state.</p><p class=\"conv-p\">To guarantee fault tolerance at **AdsGency AI**, I implement the **Saga Pattern** orchestrated through an explicit state machine. Each multi-platform campaign deployment is broken down into discrete, idempotent steps recorded in **PostgreSQL** with an execution ledger. Before executing an external mutation, the agent writes a pending step record. Upon receiving an affirmative response from the external API, the record is updated with the external platform ID.</p><p class=\"conv-p\">If a worker crashes or an external API returns a fatal failure, the supervisor worker detects the stalled job via heartbeat timeouts in **Redis**. The supervisor triggers the Saga's compensating transactions: it reads the execution ledger in reverse order and issues compensating delete or pause API calls to clean up orphaned resources on Google and Meta. If a compensating action fails, the payload is moved to a **Kafka Dead Letter Queue (DLQ)** with an automated alert to on-call engineers. This guarantees that campaigns are never left running unsupervised in partially configured states.</p>\n        </div>\n        "}, {"num": 19, "type": "verbal", "title": "Q19: AdsGency AI is a fast-moving, early-stage AI startup. How do you balance rapid feature prototyping with architectural craftsmanship and avoiding over-engineering?", "category": "Verbal Technical & Architecture", "subCategory": "Startup Engineering & Founder Collaboration", "difficulty": "Staff / MTS Interview", "search_text": "adsgency ai is a fast-moving, early-stage ai startup. how do you balance rapid feature prototyping with architectural craftsmanship and avoiding over-engineering? startup engineering & founder collaboration having worked in high-velocity teams at **uber** and **epsilon**, combined with building end-to-end full-stack platforms from scratch, i approach startup engineering with a pragmatic 'builder' mindset. in an early-stage startup like **adsgency ai**, speed to market and customer feedback loops are the company's lifeblood, but reckless shortcuts that create architectural dead-ends will paralyze scaling later.\n\nmy strategy balances velocity and craftsmanship through modular simplicity: i design systems from first principles, utilizing proven, boring technology where stability matters (such as **postgresql**, **redis**, and **fastapi**) while innovating aggressively in the ai and agentic layer. i prioritize clean domain boundaries and strict interface contracts over premature microservice decomposition. in the earliest iterations, building a clean, modular monolith in fastapi allows the team to deploy features in days rather than weeks, avoiding the overhead of managing dozens of independent network services.\n\ni avoid over-engineering by adhering strictly to the rule of three: i never build generic abstractions until we have implemented three concrete use cases that demand it. when prototyping an agent workflow, i validate the core prompt and tool loop in a script first, measure customer roi, and only then harden it with distributed queues, caching, and comprehensive telemetry. this balance ensures that adsgency ships weekly customer value while maintaining a robust foundation capable of scaling into a global enterprise platform.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Interview Question</span></h4>\n          <p class=\"body-p\" style=\"font-weight: 600; font-size: 1.05rem; color: #f8fafc;\">AdsGency AI is a fast-moving, early-stage AI startup. How do you balance rapid feature prototyping with architectural craftsmanship and avoiding over-engineering?</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-cyan\">In-Depth Technical Response (~300 Words)</span></h4>\n          <p class=\"conv-p\">Having worked in high-velocity teams at **Uber** and **Epsilon**, combined with building end-to-end full-stack platforms from scratch, I approach startup engineering with a pragmatic 'builder' mindset. In an early-stage startup like **AdsGency AI**, speed to market and customer feedback loops are the company's lifeblood, but reckless shortcuts that create architectural dead-ends will paralyze scaling later.</p><p class=\"conv-p\">My strategy balances velocity and craftsmanship through modular simplicity: I design systems from first principles, utilizing proven, boring technology where stability matters (such as **PostgreSQL**, **Redis**, and **FastAPI**) while innovating aggressively in the AI and agentic layer. I prioritize clean domain boundaries and strict interface contracts over premature microservice decomposition. In the earliest iterations, building a clean, modular monolith in FastAPI allows the team to deploy features in days rather than weeks, avoiding the overhead of managing dozens of independent network services.</p><p class=\"conv-p\">I avoid over-engineering by adhering strictly to the Rule of Three: I never build generic abstractions until we have implemented three concrete use cases that demand it. When prototyping an agent workflow, I validate the core prompt and tool loop in a script first, measure customer ROI, and only then harden it with distributed queues, caching, and comprehensive telemetry. This balance ensures that AdsGency ships weekly customer value while maintaining a robust foundation capable of scaling into a global enterprise platform.</p>\n        </div>\n        "}, {"num": 20, "type": "verbal", "title": "Q20: Walk me through how you identify and eliminate performance bottlenecks in a distributed Python/PostgreSQL/Redis microservice stack.", "category": "Verbal Technical & Architecture", "subCategory": "System Scalability & Performance Bottlenecks", "difficulty": "Staff / MTS Interview", "search_text": "walk me through how you identify and eliminate performance bottlenecks in a distributed python/postgresql/redis microservice stack. system scalability & performance bottlenecks at **dell technologies**, i identified and eliminated database bottlenecks to slash response times from **4 seconds to under 1 second**, and at **uber**, i reduced core api latencies by **2 seconds**. systematically resolving performance bottlenecks in a distributed stack requires an empirical, data-driven profiling methodology rather than speculative guessing.\n\nmy optimization workflow follows three systematic phases: instrumentation, isolation, and remediation. first, i inspect distributed traces in **opentelemetry** and apm tools to visualize the request waterfall, identifying whether latency is concentrated in network i/o, database execution, or python runtime processing. for database bottlenecks in **postgresql**, i analyze slow query logs and execute `explain (analyze, buffers)` to detect sequential table scans, missing indexes, and buffer cache misses. i remediate these by adding composite b-tree indexes, restructuring joins, and offloading repetitive read queries to **redis** with sensible ttls.\n\nin the **python/fastapi** layer, i profile cpu and memory consumption using tools like `cprofile` and `py-spy` on live container processes. common culprits include blocking synchronous calls within async endpoints, redundant json serialization with legacy serializers, or n+1 query patterns. by replacing synchronous calls with async drivers, migrating to **pydantic v2**, implementing batching with dataloader patterns, and tuning connection pools in **pgbouncer**, i eliminate latency spikes and ensure consistent sub-50ms performance even under heavy production load.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Interview Question</span></h4>\n          <p class=\"body-p\" style=\"font-weight: 600; font-size: 1.05rem; color: #f8fafc;\">Walk me through how you identify and eliminate performance bottlenecks in a distributed Python/PostgreSQL/Redis microservice stack.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-cyan\">In-Depth Technical Response (~300 Words)</span></h4>\n          <p class=\"conv-p\">At **Dell Technologies**, I identified and eliminated database bottlenecks to slash response times from **4 seconds to under 1 second**, and at **Uber**, I reduced core API latencies by **2 seconds**. Systematically resolving performance bottlenecks in a distributed stack requires an empirical, data-driven profiling methodology rather than speculative guessing.</p><p class=\"conv-p\">My optimization workflow follows three systematic phases: instrumentation, isolation, and remediation. First, I inspect distributed traces in **OpenTelemetry** and APM tools to visualize the request waterfall, identifying whether latency is concentrated in network I/O, database execution, or Python runtime processing. For database bottlenecks in **PostgreSQL**, I analyze slow query logs and execute `EXPLAIN (ANALYZE, BUFFERS)` to detect sequential table scans, missing indexes, and buffer cache misses. I remediate these by adding composite B-Tree indexes, restructuring joins, and offloading repetitive read queries to **Redis** with sensible TTLs.</p><p class=\"conv-p\">In the **Python/FastAPI** layer, I profile CPU and memory consumption using tools like `cProfile` and `py-spy` on live container processes. Common culprits include blocking synchronous calls within async endpoints, redundant JSON serialization with legacy serializers, or N+1 query patterns. By replacing synchronous calls with async drivers, migrating to **Pydantic v2**, implementing batching with DataLoader patterns, and tuning connection pools in **PgBouncer**, I eliminate latency spikes and ensure consistent sub-50ms performance even under heavy production load.</p>\n        </div>\n        "}, {"num": 21, "dsa_id": 1, "type": "dsa", "title": "Problem 1: Design a Distributed Sliding Window Log Rate Limiter", "category": "DSA & Algorithms", "subCategory": "Sliding Window / Hash Map / Queue", "difficulty": "Medium-Hard", "search_text": "design a distributed sliding window log rate limiter sliding window / hash map / queue in digital advertising platforms like adsgency ai, external apis (meta graph api, google ads api, tiktok api) enforce strict rate limits per account (e.g., maximum 100 requests per 60 seconds). implement a sliding window log rate limiter class `slidingwindowratelimiter` that evaluates whether an incoming request from an account should be allowed or dropped in real time.\n\nmethods to implement:\n- `__init__(max_requests: int, window_seconds: int)`: initializes the rate limiter with quota and sliding window window in seconds.\n- `allow_request(account_id: str, timestamp: float) -> bool`: returns `true` if the request at the given timestamp is within the rate limit, otherwise records nothing and returns `false`. to implement an exact sliding window log rate limiter, we must track the exact timestamp of every accepted request rather than relying on discrete fixed windows, which suffer from 2x boundary spikes.\n\ndata structure choice:\nwe can maintain a dictionary mapping `account_id` to a double-ended queue (`collections.deque`) of floating-point timestamps.\n\nalgorithm:\n1. when `allow_request(account_id, timestamp)` is called, retrieve the deque for the account.\n2. evict old timestamps: remove all timestamps from the left of the deque where `entry_timestamp <= timestamp - window_seconds`.\n3. check capacity: if the length of the deque is strictly less than `max_requests`, the request is allowed. we append `timestamp` to the right of the deque and return `true`.\n4. if the deque already has `max_requests`, the request breaches the rate limit. we do not record the timestamp and return `false`.\n\nin a production distributed environment like redis, this algorithm maps directly to a redis sorted set (zset) using `zremrangebyscore` to evict expired items, `zcard` to count elements, and `zadd` to record the new request within an atomic transaction.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">In digital advertising platforms like AdsGency AI, external APIs (Meta Graph API, Google Ads API, TikTok API) enforce strict rate limits per account (e.g., maximum 100 requests per 60 seconds). Implement a sliding window log rate limiter class `SlidingWindowRateLimiter` that evaluates whether an incoming request from an account should be allowed or dropped in real time.<br><br>Methods to implement:<br>- `__init__(max_requests: int, window_seconds: int)`: Initializes the rate limiter with quota and sliding window window in seconds.<br>- `allow_request(account_id: str, timestamp: float) -> bool`: Returns `True` if the request at the given timestamp is within the rate limit, otherwise records nothing and returns `False`.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">To implement an exact sliding window log rate limiter, we must track the exact timestamp of every accepted request rather than relying on discrete fixed windows, which suffer from 2x boundary spikes.<br><br>Data Structure Choice:<br>We can maintain a dictionary mapping `account_id` to a double-ended queue (`collections.deque`) of floating-point timestamps.<br><br>Algorithm:<br>1. When `allow_request(account_id, timestamp)` is called, retrieve the deque for the account.<br>2. Evict old timestamps: Remove all timestamps from the left of the deque where `entry_timestamp <= timestamp - window_seconds`.<br>3. Check capacity: If the length of the deque is strictly less than `max_requests`, the request is allowed. We append `timestamp` to the right of the deque and return `True`.<br>4. If the deque already has `max_requests`, the request breaches the rate limit. We do not record the timestamp and return `False`.<br><br>In a production distributed environment like Redis, this algorithm maps directly to a Redis Sorted Set (ZSET) using `ZREMRANGEBYSCORE` to evict expired items, `ZCARD` to count elements, and `ZADD` to record the new request within an atomic transaction.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from collections import deque\nfrom typing import Dict\n\nclass SlidingWindowRateLimiter:\n    def __init__(self, max_requests: int, window_seconds: int):\n        self.max_requests = max_requests\n        self.window_seconds = window_seconds\n        # Maps account_id -&gt; deque of timestamps\n        self.account_logs: Dict[str, deque] = {}\n\n    def allow_request(self, account_id: str, timestamp: float) -&gt; bool:\n        if account_id not in self.account_logs:\n            self.account_logs[account_id] = deque()\n\n        queue = self.account_logs[account_id]\n        window_start = timestamp - self.window_seconds\n\n        # Evict all timestamps outside the current sliding window\n        while queue and queue[0] &lt;= window_start:\n            queue.popleft()\n\n        # Check if current request can be accommodated\n        if len(queue) &lt; self.max_requests:\n            queue.append(timestamp)\n            return True\n        \n        # Quota exceeded; drop request\n        return False\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(k) per request where k is the number of expired timestamps evicted (amortized O(1) per request). Space Complexity: O(N * max_requests) where N is the number of unique active accounts.</div>\n        </div>\n        "}, {"num": 22, "dsa_id": 2, "type": "dsa", "title": "Problem 2: Multi-Agent Task Dependency Resolution & Scheduling", "category": "DSA & Algorithms", "subCategory": "Graph / Topological Sort / Kahn's Algorithm", "difficulty": "Medium", "search_text": "multi-agent task dependency resolution & scheduling graph / topological sort / kahn's algorithm an autonomous ad campaign launch at adsgency ai requires executing multiple dependent tasks across agents (e.g., task 0: generate copy, task 1: generate image assets, task 2: assemble creative, task 3: deploy to meta). given `num_tasks` and a list of directed dependencies `dependencies` where `[a, b]` means task `a` depends on task `b` (task `b` must complete before task `a` can start), return a valid execution order for the agents. if a circular dependency exists (e.g., task 0 needs task 1, and task 1 needs task 0), return an empty list `[]`. this problem models task scheduling in a workflow orchestrator like langgraph or airflow and can be solved using topological sort on a directed acyclic graph (dag).\n\nwe can apply kahn's algorithm (bfs-based topological sort):\n1. build an adjacency list `graph` where `b -> a` (since `b` must precede `a`).\n2. track the in-degree of each task (number of prerequisite tasks that must finish before this task can execute).\n3. initialize a queue with all tasks having `in_degree == 0` (tasks with zero prerequisites that can execute immediately).\n4. while the queue is non-empty, dequeue a task, append it to our `execution_order`, and decrement the in-degree of all its downstream dependent neighbors.\n5. if a neighbor's in-degree drops to 0, push it to the queue.\n6. once the queue is empty, check if `len(execution_order) == num_tasks`. if true, we found a valid schedule. if false, a cycle exists, and scheduling is impossible.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">An autonomous ad campaign launch at AdsGency AI requires executing multiple dependent tasks across agents (e.g., Task 0: Generate Copy, Task 1: Generate Image Assets, Task 2: Assemble Creative, Task 3: Deploy to Meta). Given `num_tasks` and a list of directed dependencies `dependencies` where `[a, b]` means Task `a` depends on Task `b` (Task `b` must complete before Task `a` can start), return a valid execution order for the agents. If a circular dependency exists (e.g., Task 0 needs Task 1, and Task 1 needs Task 0), return an empty list `[]`.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">This problem models task scheduling in a workflow orchestrator like LangGraph or Airflow and can be solved using Topological Sort on a Directed Acyclic Graph (DAG).<br><br>We can apply Kahn's Algorithm (BFS-based Topological Sort):<br>1. Build an adjacency list `graph` where `b -> a` (since `b` must precede `a`).<br>2. Track the in-degree of each task (number of prerequisite tasks that must finish before this task can execute).<br>3. Initialize a queue with all tasks having `in_degree == 0` (tasks with zero prerequisites that can execute immediately).<br>4. While the queue is non-empty, dequeue a task, append it to our `execution_order`, and decrement the in-degree of all its downstream dependent neighbors.<br>5. If a neighbor's in-degree drops to 0, push it to the queue.<br>6. Once the queue is empty, check if `len(execution_order) == num_tasks`. If true, we found a valid schedule. If false, a cycle exists, and scheduling is impossible.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from collections import deque\nfrom typing import List\n\nclass AgentTaskScheduler:\n    def find_execution_order(self, num_tasks: int, dependencies: List[List[int]]) -&gt; List[int]:\n        # Adjacency list: prereq -&gt; list of dependent tasks\n        graph = {i: [] for i in range(num_tasks)}\n        in_degree = [0] * num_tasks\n\n        for task, prereq in dependencies:\n            graph[prereq].append(task)\n            in_degree[task] += 1\n\n        # Tasks with 0 prerequisites can execute immediately\n        queue = deque([i for i in range(num_tasks) if in_degree[i] == 0])\n        execution_order = []\n\n        while queue:\n            curr = queue.popleft()\n            execution_order.append(curr)\n\n            for neighbor in graph[curr]:\n                in_degree[neighbor] -= 1\n                if in_degree[neighbor] == 0:\n                    queue.append(neighbor)\n\n        # If order contains all tasks, no cycle exists\n        return execution_order if len(execution_order) == num_tasks else []\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(V + E) where V = num_tasks and E = len(dependencies), as each task and edge is visited once. Space Complexity: O(V + E) to store the adjacency graph and in-degree array.</div>\n        </div>\n        "}, {"num": 23, "dsa_id": 3, "type": "dsa", "title": "Problem 3: Design In-Memory LRU Cache with Time-To-Live (TTL)", "category": "DSA & Algorithms", "subCategory": "Hash Map + Doubly Linked List", "difficulty": "Hard", "search_text": "design in-memory lru cache with time-to-live (ttl) hash map + doubly linked list adsgency ai caches external ad campaign statistics and semantic embeddings in memory. implement an lru (least recently used) cache with time-to-live (ttl) expiration.\n\nimplement the `lrucachewithttl` class:\n- `__init__(capacity: int)`: initializes the lru cache with positive size capacity.\n- `get(key: str, current_time: float) -> int`: returns the value of the key if it exists and has not expired (`current_time < expiry_time`). otherwise, removes the key and returns -1. accessing a valid key marks it as most recently used.\n- `put(key: str, value: int, ttl: float, current_time: float) -> none`: sets or inserts the key with value and expiry timestamp (`current_time + ttl`). if capacity is exceeded, evicts the least recently used unexpired key. a standard lru cache uses a hash map combined with a doubly linked list to achieve o(1) reads, updates, and evictions.\n\nto support ttl expiration:\n1. each node in the doubly linked list stores `key`, `value`, and `expires_at = current_time + ttl`.\n2. hash map maps `key -> node`.\n3. in `get(key, current_time)`:\n   - if `key` is not in map, return -1.\n   - if `node.expires_at <= current_time`, the item has expired. we delete it from the linked list and hash map and return -1.\n   - if valid, we move the node to the head of the doubly linked list (most recently used) and return its value.\n4. in `put(key, value, ttl, current_time)`:\n   - if `key` already exists, update its value and expiry, and move it to the head.\n   - if new key and cache is at capacity, remove the tail node (least recently used) from both the linked list and hash map.\n   - insert the new node at the head.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">AdsGency AI caches external ad campaign statistics and semantic embeddings in memory. Implement an LRU (Least Recently Used) cache with Time-To-Live (TTL) expiration.<br><br>Implement the `LRUCacheWithTTL` class:<br>- `__init__(capacity: int)`: Initializes the LRU cache with positive size capacity.<br>- `get(key: str, current_time: float) -> int`: Returns the value of the key if it exists and has not expired (`current_time < expiry_time`). Otherwise, removes the key and returns -1. Accessing a valid key marks it as most recently used.<br>- `put(key: str, value: int, ttl: float, current_time: float) -> None`: Sets or inserts the key with value and expiry timestamp (`current_time + ttl`). If capacity is exceeded, evicts the least recently used unexpired key.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">A standard LRU cache uses a Hash Map combined with a Doubly Linked List to achieve O(1) reads, updates, and evictions.<br><br>To support TTL expiration:<br>1. Each node in the doubly linked list stores `key`, `value`, and `expires_at = current_time + ttl`.<br>2. Hash Map maps `key -> Node`.<br>3. In `get(key, current_time)`:<br>   - If `key` is not in map, return -1.<br>   - If `node.expires_at <= current_time`, the item has expired. We delete it from the linked list and hash map and return -1.<br>   - If valid, we move the node to the head of the doubly linked list (most recently used) and return its value.<br>4. In `put(key, value, ttl, current_time)`:<br>   - If `key` already exists, update its value and expiry, and move it to the head.<br>   - If new key and cache is at capacity, remove the tail node (least recently used) from both the linked list and hash map.<br>   - Insert the new node at the head.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from typing import Optional, Dict\n\nclass Node:\n    def __init__(self, key: str, value: int, expires_at: float):\n        self.key = key\n        self.value = value\n        self.expires_at = expires_at\n        self.prev: Optional['Node'] = None\n        self.next: Optional['Node'] = None\n\nclass LRUCacheWithTTL:\n    def __init__(self, capacity: int):\n        self.capacity = capacity\n        self.cache: Dict[str, Node] = {}\n        # Sentinel dummy nodes\n        self.head = Node(\"\", 0, float('inf'))\n        self.tail = Node(\"\", 0, float('inf'))\n        self.head.next = self.tail\n        self.tail.prev = self.head\n\n    def _remove(self, node: Node) -&gt; None:\n        prev_node = node.prev\n        next_node = node.next\n        prev_node.next = next_node\n        next_node.prev = prev_node\n\n    def _add_to_head(self, node: Node) -&gt; None:\n        node.next = self.head.next\n        node.prev = self.head\n        self.head.next.prev = node\n        self.head.next = node\n\n    def get(self, key: str, current_time: float) -&gt; int:\n        if key not in self.cache:\n            return -1\n\n        node = self.cache[key]\n        # Check expiration\n        if current_time &gt;= node.expires_at:\n            self._remove(node)\n            del self.cache[key]\n            return -1\n\n        # Move accessed node to head (most recently used)\n        self._remove(node)\n        self._add_to_head(node)\n        return node.value\n\n    def put(self, key: str, value: int, ttl: float, current_time: float) -&gt; None:\n        expires_at = current_time + ttl\n\n        if key in self.cache:\n            node = self.cache[key]\n            self._remove(node)\n            node.value = value\n            node.expires_at = expires_at\n            self._add_to_head(node)\n            return\n\n        if len(self.cache) &gt;= self.capacity:\n            # Evict LRU node from tail\n            lru = self.tail.prev\n            self._remove(lru)\n            del self.cache[lru.key]\n\n        new_node = Node(key, value, expires_at)\n        self._add_to_head(new_node)\n        self.cache[key] = new_node\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(1) for both get and put operations. Space Complexity: O(capacity) to store nodes and hash map entries.</div>\n        </div>\n        "}, {"num": 24, "dsa_id": 4, "type": "dsa", "title": "Problem 4: Optimal Ad Campaign Budget Allocation (Knapsack DP)", "category": "DSA & Algorithms", "subCategory": "Dynamic Programming / 0-1 Knapsack", "difficulty": "Medium", "search_text": "optimal ad campaign budget allocation (knapsack dp) dynamic programming / 0-1 knapsack adsgency ai is given a total client daily advertising budget `total_budget` (in dollars). a set of candidate ad campaigns is available, each with a required cost `costs[i]` and an estimated conversion return value `returns[i]`. each campaign can be either fully funded once or skipped. determine the maximum expected conversion return that can be achieved without exceeding `total_budget`. this problem is a classic 0/1 knapsack optimization problem.\n\nstate representation:\nlet `dp[b]` represent the maximum conversion return achievable using a budget of exactly or at most `b`.\n\nbase case:\n`dp[b] = 0` for all `0 <= b <= total_budget`.\n\ntransitions:\nfor each campaign `i` with cost `c = costs[i]` and return `r = returns[i]`:\nwe iterate backwards from `total_budget` down to `c`:\n`dp[b] = max(dp[b], dp[b - c] + r)`\niterating backwards ensures that each campaign is used at most once (avoiding unbounded knapsack behavior).\n\nafter evaluating all campaigns, `dp[total_budget]` contains the maximum possible return.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">AdsGency AI is given a total client daily advertising budget `total_budget` (in dollars). A set of candidate ad campaigns is available, each with a required cost `costs[i]` and an estimated conversion return value `returns[i]`. Each campaign can be either fully funded once or skipped. Determine the maximum expected conversion return that can be achieved without exceeding `total_budget`.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">This problem is a classic 0/1 Knapsack optimization problem.<br><br>State Representation:<br>Let `dp[b]` represent the maximum conversion return achievable using a budget of exactly or at most `b`.<br><br>Base Case:<br>`dp[b] = 0` for all `0 <= b <= total_budget`.<br><br>Transitions:<br>For each campaign `i` with cost `c = costs[i]` and return `r = returns[i]`:<br>We iterate backwards from `total_budget` down to `c`:<br>`dp[b] = max(dp[b], dp[b - c] + r)`<br>Iterating backwards ensures that each campaign is used at most once (avoiding unbounded knapsack behavior).<br><br>After evaluating all campaigns, `dp[total_budget]` contains the maximum possible return.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from typing import List\n\nclass CampaignBudgetOptimizer:\n    def max_conversion_return(self, total_budget: int, costs: List[int], returns: List[int]) -&gt; int:\n        n = len(costs)\n        # dp[b] stores max return achievable with budget b\n        dp = [0] * (total_budget + 1)\n\n        for i in range(n):\n            c = costs[i]\n            r = returns[i]\n            # Iterate backwards to ensure 0/1 constraint\n            for b in range(total_budget, c - 1, -1):\n                dp[b] = max(dp[b], dp[b - c] + r)\n\n        return dp[total_budget]\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(N * total_budget) where N is the number of candidate campaigns. Space Complexity: O(total_budget) using a 1D space-optimized dynamic programming array.</div>\n        </div>\n        "}, {"num": 25, "dsa_id": 5, "type": "dsa", "title": "Problem 5: Ad Keyword Autocomplete & Prefix Search (Trie)", "category": "DSA & Algorithms", "subCategory": "Trie / Tree / Prefix Search", "difficulty": "Medium", "search_text": "ad keyword autocomplete & prefix search (trie) trie / tree / prefix search adsgency ai provides a search bar where marketing operators type ad keywords to see autocomplete recommendations. implement a trie-based autocomplete system `keywordtrie` that stores ad keywords along with their search popularity frequencies.\n\nmethods:\n- `insert(word: str, frequency: int) -> none`: inserts a keyword and its historical search volume.\n- `search_prefix(prefix: str) -> list[str]`: returns up to the top 3 highest-frequency keywords starting with `prefix`. if frequencies tie, sort lexicographically. a trie (prefix tree) is the optimal structure for prefix-based search and autocomplete queries.\n\nnode design:\neach `trienode` contains:\n- `children`: dict mapping char -> trienode\n- `top_words`: a cached list of the top words passing through or ending at this prefix node, sorted by `(-frequency, word)`.\n\nalgorithm:\n1. when inserting `(word, frequency)`, traverse the trie character by character.\n2. at each node along the path (including root), maintain the top candidate keywords. we can update the list of candidates, sort by `(-freq, word)`, and slice the top 3.\n3. in `search_prefix(prefix)`, traverse down to the node corresponding to the last character of `prefix`. if any character is missing, return `[]`.\n4. if found, return the pre-computed `top_words` in o(1) time relative to the prefix length.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">AdsGency AI provides a search bar where marketing operators type ad keywords to see autocomplete recommendations. Implement a Trie-based autocomplete system `KeywordTrie` that stores ad keywords along with their search popularity frequencies.<br><br>Methods:<br>- `insert(word: str, frequency: int) -> None`: Inserts a keyword and its historical search volume.<br>- `search_prefix(prefix: str) -> List[str]`: Returns up to the top 3 highest-frequency keywords starting with `prefix`. If frequencies tie, sort lexicographically.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">A Trie (Prefix Tree) is the optimal structure for prefix-based search and autocomplete queries.<br><br>Node Design:<br>Each `TrieNode` contains:<br>- `children`: Dict mapping char -> TrieNode<br>- `top_words`: A cached list of the top words passing through or ending at this prefix node, sorted by `(-frequency, word)`.<br><br>Algorithm:<br>1. When inserting `(word, frequency)`, traverse the Trie character by character.<br>2. At each node along the path (including root), maintain the top candidate keywords. We can update the list of candidates, sort by `(-freq, word)`, and slice the top 3.<br>3. In `search_prefix(prefix)`, traverse down to the node corresponding to the last character of `prefix`. If any character is missing, return `[]`.<br>4. If found, return the pre-computed `top_words` in O(1) time relative to the prefix length.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from typing import List, Dict\n\nclass TrieNode:\n    def __init__(self):\n        self.children: Dict[str, 'TrieNode'] = {}\n        # Stores tuples of (-frequency, word) for top suggestions\n        self.top_suggestions: List[tuple] = []\n\nclass KeywordTrie:\n    def __init__(self):\n        self.root = TrieNode()\n\n    def insert(self, word: str, frequency: int) -&gt; None:\n        node = self.root\n        for char in word:\n            if char not in node.children:\n                node.children[char] = TrieNode()\n            node = node.children[char]\n            \n            # Update suggestions at current prefix\n            node.top_suggestions = [item for item in node.top_suggestions if item[1] != word]\n            node.top_suggestions.append((-frequency, word))\n            node.top_suggestions.sort()\n            if len(node.top_suggestions) &gt; 3:\n                node.top_suggestions.pop()\n\n    def search_prefix(self, prefix: str) -&gt; List[str]:\n        node = self.root\n        for char in prefix:\n            if char not in node.children:\n                return []\n            node = node.children[char]\n        return [word for _, word in node.top_suggestions]\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: Insert is O(L * K log K) where L is keyword length and K = 3. Search is O(P) where P is prefix length. Space Complexity: O(N * L) where N is number of words and L is average word length.</div>\n        </div>\n        "}, {"num": 26, "dsa_id": 6, "type": "dsa", "title": "Problem 6: Real-Time Event Stream Deduplication", "category": "DSA & Algorithms", "subCategory": "Sliding Window / Hash Set / Deque", "difficulty": "Medium", "search_text": "real-time event stream deduplication sliding window / hash set / deque adsgency ai consumes conversion webhooks from meta, google, and tiktok. due to network retries, duplicate events frequently arrive within a 10-minute sliding window. given a stream of events `(event_id, timestamp)` arriving in chronological order, implement `eventdeduplicator` that filters out duplicate events within a 600-second window while keeping memory bounded. to deduplicate streaming events with a time window constraint:\n1. we maintain a hash set `seen_ids` for o(1) membership lookup.\n2. we maintain a double-ended queue `event_queue` storing `(event_id, timestamp)` in chronological order.\n3. for each incoming event `(event_id, timestamp)`:\n   - evict expired events: while `event_queue` is non-empty and `event_queue[0][1] <= timestamp - 600`, pop the oldest event `(old_id, old_time)` and remove `old_id` from `seen_ids`.\n   - check duplication: if `event_id` is in `seen_ids`, it is a duplicate\u2014drop it and return `false`.\n   - otherwise, add `event_id` to `seen_ids`, append `(event_id, timestamp)` to `event_queue`, and return `true`.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">AdsGency AI consumes conversion webhooks from Meta, Google, and TikTok. Due to network retries, duplicate events frequently arrive within a 10-minute sliding window. Given a stream of events `(event_id, timestamp)` arriving in chronological order, implement `EventDeduplicator` that filters out duplicate events within a 600-second window while keeping memory bounded.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">To deduplicate streaming events with a time window constraint:<br>1. We maintain a Hash Set `seen_ids` for O(1) membership lookup.<br>2. We maintain a double-ended queue `event_queue` storing `(event_id, timestamp)` in chronological order.<br>3. For each incoming event `(event_id, timestamp)`:<br>   - Evict expired events: While `event_queue` is non-empty and `event_queue[0][1] <= timestamp - 600`, pop the oldest event `(old_id, old_time)` and remove `old_id` from `seen_ids`.<br>   - Check duplication: If `event_id` is in `seen_ids`, it is a duplicate\u2014drop it and return `False`.<br>   - Otherwise, add `event_id` to `seen_ids`, append `(event_id, timestamp)` to `event_queue`, and return `True`.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from collections import deque\nfrom typing import Set, Tuple\n\nclass EventDeduplicator:\n    def __init__(self, window_seconds: int = 600):\n        self.window_seconds = window_seconds\n        self.seen_ids: Set[str] = set()\n        self.event_queue: deque[Tuple[str, float]] = deque()\n\n    def process_event(self, event_id: str, timestamp: float) -&gt; bool:\n        # Evict events older than window_seconds\n        cutoff = timestamp - self.window_seconds\n        while self.event_queue and self.event_queue[0][1] &lt;= cutoff:\n            old_id, _ = self.event_queue.popleft()\n            self.seen_ids.discard(old_id)\n\n        # Check for duplicate\n        if event_id in self.seen_ids:\n            return False\n\n        # Register new unique event\n        self.seen_ids.add(event_id)\n        self.event_queue.append((event_id, timestamp))\n        return True\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: Amortized O(1) per incoming event. Space Complexity: O(W) where W is the number of events received within the 10-minute window.</div>\n        </div>\n        "}, {"num": 27, "dsa_id": 7, "type": "dsa", "title": "Problem 7: Priority Queue for Multi-Platform Ad Bidding", "category": "DSA & Algorithms", "subCategory": "Heap / Priority Queue", "difficulty": "Medium", "search_text": "priority queue for multi-platform ad bidding heap / priority queue adsgency ai manages real-time bids across multiple ad auctions. each bid has an `auction_id`, a `bid_amount`, and an `expected_ctr`. the composite priority score of a bid is defined as `score = bid_amount * expected_ctr`. implement `adbidauctionmanager` to maintain the top-k highest priority bids across streaming updates. to maintain the top-k highest scoring items from a continuous stream:\na min-heap of fixed size `k` is the optimal choice.\n\nalgorithm:\n1. store elements in the min-heap as `(score, auction_id, bid_amount)`.\n2. when a new bid arrives:\n   - calculate its score: `score = bid_amount * expected_ctr`.\n   - if the heap has fewer than `k` items, push the bid.\n   - if the heap has `k` items and the new bid's score is strictly greater than the heap root (the smallest score among current top-k), pop the root and push the new bid.\n3. to retrieve current top bids, extract and sort the elements descending.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">AdsGency AI manages real-time bids across multiple ad auctions. Each bid has an `auction_id`, a `bid_amount`, and an `expected_ctr`. The composite priority score of a bid is defined as `score = bid_amount * expected_ctr`. Implement `AdBidAuctionManager` to maintain the top-k highest priority bids across streaming updates.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">To maintain the top-k highest scoring items from a continuous stream:<br>A Min-Heap of fixed size `k` is the optimal choice.<br><br>Algorithm:<br>1. Store elements in the min-heap as `(score, auction_id, bid_amount)`.<br>2. When a new bid arrives:<br>   - Calculate its score: `score = bid_amount * expected_ctr`.<br>   - If the heap has fewer than `k` items, push the bid.<br>   - If the heap has `k` items and the new bid's score is strictly greater than the heap root (the smallest score among current top-k), pop the root and push the new bid.<br>3. To retrieve current top bids, extract and sort the elements descending.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">import heapq\nfrom typing import List, Tuple\n\nclass AdBidAuctionManager:\n    def __init__(self, k: int):\n        self.k = k\n        # Min-heap storing tuples of (score, auction_id, bid_amount)\n        self.min_heap: List[Tuple[float, str, float]] = []\n\n    def submit_bid(self, auction_id: str, bid_amount: float, expected_ctr: float) -&gt; None:\n        score = round(bid_amount * expected_ctr, 4)\n\n        if len(self.min_heap) &lt; self.k:\n            heapq.heappush(self.min_heap, (score, auction_id, bid_amount))\n        elif score &gt; self.min_heap[0][0]:\n            heapq.heapreplace(self.min_heap, (score, auction_id, bid_amount))\n\n    def get_top_bids(self) -&gt; List[Tuple[str, float, float]]:\n        # Return sorted descending by score\n        return [(item[1], item[2], item[0]) for item in sorted(self.min_heap, reverse=True)]\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(log k) for each bid submission. O(k log k) to inspect top bids. Space Complexity: O(k) for the bounded heap.</div>\n        </div>\n        "}, {"num": 28, "dsa_id": 8, "type": "dsa", "title": "Problem 8: Merge Overlapping Campaign Flight Schedules", "category": "DSA & Algorithms", "subCategory": "Intervals / Sorting", "difficulty": "Medium", "search_text": "merge overlapping campaign flight schedules intervals / sorting multiple ad sets run during specified start and end dates (intervals). given an array of intervals `schedules` where `schedules[i] = [start_i, end_i]`, merge all overlapping campaign schedules and return an array of the non-overlapping intervals that cover all the schedules in the input. this is the classic merge intervals problem, essential for calculating continuous active campaign flight dates.\n\nalgorithm:\n1. if the input list is empty or has 1 interval, return it immediately.\n2. sort the intervals based on their start times: `schedules.sort(key=lambda x: x[0])`.\n3. initialize an empty list `merged` and append the first interval.\n4. iterate through the remaining intervals `curr`:\n   - let `last = merged[-1]`.\n   - if `curr[0] <= last[1]`, the intervals overlap. update `last[1] = max(last[1], curr[1])`.\n   - otherwise, there is no overlap; append `curr` to `merged`.\n5. return `merged`.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">Multiple ad sets run during specified start and end dates (intervals). Given an array of intervals `schedules` where `schedules[i] = [start_i, end_i]`, merge all overlapping campaign schedules and return an array of the non-overlapping intervals that cover all the schedules in the input.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">This is the classic Merge Intervals problem, essential for calculating continuous active campaign flight dates.<br><br>Algorithm:<br>1. If the input list is empty or has 1 interval, return it immediately.<br>2. Sort the intervals based on their start times: `schedules.sort(key=lambda x: x[0])`.<br>3. Initialize an empty list `merged` and append the first interval.<br>4. Iterate through the remaining intervals `curr`:<br>   - Let `last = merged[-1]`.<br>   - If `curr[0] <= last[1]`, the intervals overlap. Update `last[1] = max(last[1], curr[1])`.<br>   - Otherwise, there is no overlap; append `curr` to `merged`.<br>5. Return `merged`.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from typing import List\n\nclass CampaignScheduleMerger:\n    def merge_schedules(self, schedules: List[List[int]]) -&gt; List[List[int]]:\n        if not schedules:\n            return []\n\n        # Sort by interval start time\n        schedules.sort(key=lambda x: x[0])\n        merged = [schedules[0]]\n\n        for curr in schedules[1:]:\n            last = merged[-1]\n            # Overlap detected\n            if curr[0] &lt;= last[1]:\n                last[1] = max(last[1], curr[1])\n            else:\n                merged.append(curr)\n\n        return merged\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(N log N) dominated by sorting the intervals. Space Complexity: O(N) to store the merged result.</div>\n        </div>\n        "}, {"num": 29, "dsa_id": 9, "type": "dsa", "title": "Problem 9: Detect Circular Delegation Loops in Multi-Agent Workflows", "category": "DSA & Algorithms", "subCategory": "Graph / DFS / Cycle Detection", "difficulty": "Medium", "search_text": "detect circular delegation loops in multi-agent workflows graph / dfs / cycle detection in adsgency's multi-agent system, an agent can delegate sub-tasks to other agents. given an integer `num_agents` (labeled `0` to `num_agents - 1`) and a list of directed delegation pairs `delegations` where `[u, v]` represents agent `u` delegating to agent `v`, determine whether the delegation network contains any circular deadlocks (cycles). return `true` if a cycle exists, and `false` otherwise. to detect a cycle in a directed graph, we can use depth first search (dfs) with a 3-color state tracking approach:\n- state 0 (white / unvisited): node has not been visited yet.\n- state 1 (gray / visiting): node is currently in the active dfs recursion stack.\n- state 2 (black / visited): node and all its descendants have been completely processed.\n\nalgorithm:\n1. build an adjacency list `graph`.\n2. maintain a `visited` array initialized to 0 for all nodes.\n3. for each node from `0` to `num_agents - 1`:\n   - if the node is in state 0, run dfs.\n   - if dfs encounters a node in state 1 (currently in the active recursion call stack), a back-edge is found, meaning a cycle exists! return `true`.\n4. if all nodes reach state 2 without encountering a back-edge, return `false`.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">In AdsGency's multi-agent system, an agent can delegate sub-tasks to other agents. Given an integer `num_agents` (labeled `0` to `num_agents - 1`) and a list of directed delegation pairs `delegations` where `[u, v]` represents Agent `u` delegating to Agent `v`, determine whether the delegation network contains any circular deadlocks (cycles). Return `True` if a cycle exists, and `False` otherwise.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">To detect a cycle in a directed graph, we can use Depth First Search (DFS) with a 3-color state tracking approach:<br>- State 0 (WHITE / Unvisited): Node has not been visited yet.<br>- State 1 (GRAY / Visiting): Node is currently in the active DFS recursion stack.<br>- State 2 (BLACK / Visited): Node and all its descendants have been completely processed.<br><br>Algorithm:<br>1. Build an adjacency list `graph`.<br>2. Maintain a `visited` array initialized to 0 for all nodes.<br>3. For each node from `0` to `num_agents - 1`:<br>   - If the node is in State 0, run DFS.<br>   - If DFS encounters a node in State 1 (currently in the active recursion call stack), a back-edge is found, meaning a cycle exists! Return `True`.<br>4. If all nodes reach State 2 without encountering a back-edge, return `False`.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from typing import List\n\nclass MultiAgentDeadlockDetector:\n    def has_circular_delegation(self, num_agents: int, delegations: List[List[int]]) -&gt; bool:\n        graph = {i: [] for i in range(num_agents)}\n        for u, v in delegations:\n            graph[u].append(v)\n\n        # 0 = Unvisited, 1 = Visiting (in current path), 2 = Completely Visited\n        state = [0] * num_agents\n\n        def dfs(node: int) -&gt; bool:\n            state[node] = 1  # Mark visiting\n\n            for neighbor in graph[node]:\n                if state[neighbor] == 1:\n                    return True  # Cycle detected\n                if state[neighbor] == 0:\n                    if dfs(neighbor):\n                        return True\n\n            state[node] = 2  # Mark completely processed\n            return False\n\n        for agent in range(num_agents):\n            if state[agent] == 0:\n                if dfs(agent):\n                    return True\n\n        return False\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(V + E) where V = num_agents and E = len(delegations). Space Complexity: O(V + E) for graph storage and recursion call stack.</div>\n        </div>\n        "}, {"num": 30, "dsa_id": 10, "type": "dsa", "title": "Problem 10: Longest Substring Without Repeating Keywords", "category": "DSA & Algorithms", "subCategory": "Sliding Window / Two Pointers / Hash Map", "difficulty": "Medium", "search_text": "longest substring without repeating keywords sliding window / two pointers / hash map adsgency ai generates comma-separated ad headline tags. given a string `tags` containing characters, find the length of the longest contiguous substring without any repeating characters to maximize headline variety. we use a dynamic sliding window with two pointers (`left` and `right`) and a hash map `last_seen` that tracks the most recent index of each character.\n\nalgorithm:\n1. initialize `max_len = 0` and `left = 0`.\n2. iterate `right` from 0 to `len(tags) - 1`:\n   - let `char = tags[right]`.\n   - if `char` is in `last_seen` and its last seen index is `>= left`, advance `left` to `last_seen[char] + 1` to exclude the duplicate.\n   - update `last_seen[char] = right`.\n   - update `max_len = max(max_len, right - left + 1)`.\n3. return `max_len`.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">AdsGency AI generates comma-separated ad headline tags. Given a string `tags` containing characters, find the length of the longest contiguous substring without any repeating characters to maximize headline variety.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">We use a dynamic sliding window with two pointers (`left` and `right`) and a Hash Map `last_seen` that tracks the most recent index of each character.<br><br>Algorithm:<br>1. Initialize `max_len = 0` and `left = 0`.<br>2. Iterate `right` from 0 to `len(tags) - 1`:<br>   - Let `char = tags[right]`.<br>   - If `char` is in `last_seen` and its last seen index is `>= left`, advance `left` to `last_seen[char] + 1` to exclude the duplicate.<br>   - Update `last_seen[char] = right`.<br>   - Update `max_len = max(max_len, right - left + 1)`.<br>3. Return `max_len`.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">class HeadlineVarietyFinder:\n    def length_of_longest_unique_substring(self, s: str) -&gt; int:\n        last_seen = {}\n        max_len = 0\n        left = 0\n\n        for right, char in enumerate(s):\n            if char in last_seen and last_seen[char] &gt;= left:\n                left = last_seen[char] + 1\n            last_seen[char] = right\n            max_len = max(max_len, right - left + 1)\n\n        return max_len\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(N) where N is string length, as both pointers traverse at most N steps. Space Complexity: O(min(N, M)) where M is the character alphabet size.</div>\n        </div>\n        "}, {"num": 31, "dsa_id": 11, "type": "dsa", "title": "Problem 11: Design In-Memory Key-Value Store with TTL & Transactions", "category": "DSA & Algorithms", "subCategory": "Design / Stack / Hash Map", "difficulty": "Hard", "search_text": "design in-memory key-value store with ttl & transactions design / stack / hash map implement an in-memory transactional key-value store `transactionalkv` supporting `get`, `set`, `delete`, and transaction commands `begin`, `commit`, and `rollback`. transactions can be nested. if a transaction is rolled back, all mutations made within it must be reverted. to support nested transactions with rollback:\n1. we maintain a primary database dictionary `store`.\n2. we maintain a stack of transaction contexts `transaction_stack = []`.\n3. when `begin()` is called, push an empty dictionary representing the delta/undo log for that transaction level.\n4. when `set(key, value)` or `delete(key)` is called:\n   - if inside a transaction (`transaction_stack` is non-empty), record the previous state of `key` in the top transaction's undo log (if not already recorded).\n   - apply the mutation to `store`.\n5. when `rollback()` is called:\n   - pop the top transaction from the stack.\n   - for every key in the undo log, restore its previous value in `store`.\n6. when `commit()` is called:\n   - pop the top transaction. if there is an outer parent transaction, merge the undo log into the parent. if it was the outermost transaction, changes become permanent.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">Implement an in-memory transactional key-value store `TransactionalKV` supporting `get`, `set`, `delete`, and transaction commands `begin`, `commit`, and `rollback`. Transactions can be nested. If a transaction is rolled back, all mutations made within it must be reverted.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">To support nested transactions with rollback:<br>1. We maintain a primary database dictionary `store`.<br>2. We maintain a stack of transaction contexts `transaction_stack = []`.<br>3. When `begin()` is called, push an empty dictionary representing the delta/undo log for that transaction level.<br>4. When `set(key, value)` or `delete(key)` is called:<br>   - If inside a transaction (`transaction_stack` is non-empty), record the previous state of `key` in the top transaction's undo log (if not already recorded).<br>   - Apply the mutation to `store`.<br>5. When `rollback()` is called:<br>   - Pop the top transaction from the stack.<br>   - For every key in the undo log, restore its previous value in `store`.<br>6. When `commit()` is called:<br>   - Pop the top transaction. If there is an outer parent transaction, merge the undo log into the parent. If it was the outermost transaction, changes become permanent.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from typing import Optional, Dict, List\n\nclass TransactionalKV:\n    def __init__(self):\n        self.store: Dict[str, str] = {}\n        # Stack of undo logs: maps key -&gt; previous_value (None if key was absent)\n        self.transaction_stack: List[Dict[str, Optional[str]]] = []\n\n    def get(self, key: str) -&gt; Optional[str]:\n        return self.store.get(key, None)\n\n    def set(self, key: str, value: str) -&gt; None:\n        if self.transaction_stack:\n            # Record original value before mutation if not yet recorded in current tx\n            undo_log = self.transaction_stack[-1]\n            if key not in undo_log:\n                undo_log[key] = self.store.get(key, None)\n        self.store[key] = value\n\n    def delete(self, key: str) -&gt; None:\n        if self.transaction_stack:\n            undo_log = self.transaction_stack[-1]\n            if key not in undo_log:\n                undo_log[key] = self.store.get(key, None)\n        self.store.pop(key, None)\n\n    def begin(self) -&gt; None:\n        self.transaction_stack.append({})\n\n    def commit(self) -&gt; bool:\n        if not self.transaction_stack:\n            return False\n        committed_undo = self.transaction_stack.pop()\n        # If nested, merge into parent transaction\n        if self.transaction_stack:\n            parent_undo = self.transaction_stack[-1]\n            for key, val in committed_undo.items():\n                if key not in parent_undo:\n                    parent_undo[key] = val\n        return True\n\n    def rollback(self) -&gt; bool:\n        if not self.transaction_stack:\n            return False\n        undo_log = self.transaction_stack.pop()\n        for key, prev_val in undo_log.items():\n            if prev_val is None:\n                self.store.pop(key, None)\n            else:\n                self.store[key] = prev_val\n        return True\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(1) for get, set, delete, and begin. O(K) for commit and rollback where K is the number of keys mutated in the transaction. Space Complexity: O(N + K) where N is total keys and K is uncommitted mutations.</div>\n        </div>\n        "}, {"num": 32, "dsa_id": 12, "type": "dsa", "title": "Problem 12: Top-K Frequent Ad Search Queries in Streaming Window", "category": "DSA & Algorithms", "subCategory": "Hash Map + Min-Heap", "difficulty": "Medium", "search_text": "top-k frequent ad search queries in streaming window hash map + min-heap given a list of ad search keyword queries `queries` and an integer `k`, return the `k` most frequent queries. if two queries have the same frequency, the one with lower alphabetical order should come first. 1. count the frequency of each search query using `collections.counter`.\n2. we need the top `k` elements based on `(frequency desc, query asc)`.\n3. to achieve o(n log k) time complexity, we can use a min-heap of size `k`.\n   - in python, we define a wrapper class or tuple. for a min-heap, we want lower frequency to be popped first, and higher alphabetical string to be popped first in tie-breaks.\n   - so we store `(freq, reversestring(query))` or sort the frequencies directly using `heapq.nsmallest` / `heapq.nlargest`.\n4. alternatively, use python's `heapq` with custom comparison or sort all unique keys by `(-freq, query)` and slice `[:k]`.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">Given a list of ad search keyword queries `queries` and an integer `k`, return the `k` most frequent queries. If two queries have the same frequency, the one with lower alphabetical order should come first.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">1. Count the frequency of each search query using `collections.Counter`.<br>2. We need the top `k` elements based on `(frequency DESC, query ASC)`.<br>3. To achieve O(N log K) time complexity, we can use a Min-Heap of size `k`.<br>   - In Python, we define a wrapper class or tuple. For a min-heap, we want lower frequency to be popped first, and higher alphabetical string to be popped first in tie-breaks.<br>   - So we store `(freq, ReverseString(query))` or sort the frequencies directly using `heapq.nsmallest` / `heapq.nlargest`.<br>4. Alternatively, use Python's `heapq` with custom comparison or sort all unique keys by `(-freq, query)` and slice `[:k]`.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from collections import Counter\nimport heapq\nfrom typing import List\n\nclass FrequencyQueryItem:\n    def __init__(self, query: str, freq: int):\n        self.query = query\n        self.freq = freq\n\n    def __lt__(self, other: 'FrequencyQueryItem') -&gt; bool:\n        # Min-heap criteria: smaller freq first; if tie, lexicographically larger query first\n        if self.freq != other.freq:\n            return self.freq &lt; other.freq\n        return self.query &gt; other.query\n\nclass TopKQueryTracker:\n    def top_k_queries(self, queries: List[str], k: int) -&gt; List[str]:\n        counts = Counter(queries)\n        min_heap = []\n\n        for query, freq in counts.items():\n            item = FrequencyQueryItem(query, freq)\n            heapq.heappush(min_heap, item)\n            if len(min_heap) &gt; k:\n                heapq.heappop(min_heap)\n\n        # Extract items and sort descending by priority\n        result = []\n        while min_heap:\n            result.append(heapq.heappop(min_heap))\n        \n        result.sort(key=lambda x: (-x.freq, x.query))\n        return [x.query for x in result]\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(N + U log K) where N is len(queries) and U is unique queries count. Space Complexity: O(U) for the frequency map and O(k) for the heap.</div>\n        </div>\n        "}, {"num": 33, "dsa_id": 13, "type": "dsa", "title": "Problem 13: Subarray Spend Sum Equals Target Budget", "category": "DSA & Algorithms", "subCategory": "Prefix Sums + Hash Map", "difficulty": "Medium", "search_text": "subarray spend sum equals target budget prefix sums + hash map given an array of integers `daily_spends` representing daily marketing costs and an integer `target_budget`, return the total number of continuous sub-periods (subarrays) where the cumulative ad spend equals exactly `target_budget`. a brute-force solution checks all o(n^2) subarrays.\nwe can optimize this to o(n) using prefix sums and a hash map:\n\nlet `prefix_sum[i]` be the cumulative sum from index 0 to `i`.\na subarray from `j + 1` to `i` has sum:\n`sum(j+1...i) = prefix_sum[i] - prefix_sum[j]`\nwe want this to equal `target_budget`:\n`prefix_sum[i] - prefix_sum[j] = target_budget`\nrearranging:\n`prefix_sum[j] = prefix_sum[i] - target_budget`\n\nalgorithm:\n1. maintain `running_sum = 0` and a hash map `prefix_counts` initialized with `{0: 1}` (representing an empty subarray).\n2. for each value in `daily_spends`:\n   - `running_sum += val`\n   - if `(running_sum - target_budget)` exists in `prefix_counts`, add its frequency to `count`.\n   - increment `prefix_counts[running_sum]`.\n3. return `count`.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">Given an array of integers `daily_spends` representing daily marketing costs and an integer `target_budget`, return the total number of continuous sub-periods (subarrays) where the cumulative ad spend equals exactly `target_budget`.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">A brute-force solution checks all O(N^2) subarrays.<br>We can optimize this to O(N) using Prefix Sums and a Hash Map:<br><br>Let `prefix_sum[i]` be the cumulative sum from index 0 to `i`.<br>A subarray from `j + 1` to `i` has sum:<br>`sum(j+1...i) = prefix_sum[i] - prefix_sum[j]`<br>We want this to equal `target_budget`:<br>`prefix_sum[i] - prefix_sum[j] = target_budget`<br>Rearranging:<br>`prefix_sum[j] = prefix_sum[i] - target_budget`<br><br>Algorithm:<br>1. Maintain `running_sum = 0` and a hash map `prefix_counts` initialized with `{0: 1}` (representing an empty subarray).<br>2. For each value in `daily_spends`:<br>   - `running_sum += val`<br>   - If `(running_sum - target_budget)` exists in `prefix_counts`, add its frequency to `count`.<br>   - Increment `prefix_counts[running_sum]`.<br>3. Return `count`.</p>\n        </div>\n        <div class=\"section-block\">\n          <div class=\"code-header\">\n            <span>Python 3 Solution</span>\n            <button class=\"btn-copy-code\" onclick=\"copyCode(this)\">Copy Code</button>\n          </div>\n          <pre class=\"code-box\"><code class=\"language-python\">from collections import defaultdict\nfrom typing import List\n\nclass BudgetPacingAuditor:\n    def count_target_spend_subarrays(self, daily_spends: List[int], target_budget: int) -&gt; int:\n        prefix_counts = defaultdict(int)\n        prefix_counts[0] = 1  # Base case for subarray starting at index 0\n\n        running_sum = 0\n        total_subarrays = 0\n\n        for spend in daily_spends:\n            running_sum += spend\n            complement = running_sum - target_budget\n            if complement in prefix_counts:\n                total_subarrays += prefix_counts[complement]\n            prefix_counts[running_sum] += 1\n\n        return total_subarrays\n</code></pre>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-green\">Complexity Analysis</span></h4>\n          <div class=\"complexity-box\">Time Complexity: O(N) single pass through the array. Space Complexity: O(N) to store prefix sum frequencies.</div>\n        </div>\n        "}, {"num": 34, "dsa_id": 14, "type": "dsa", "title": "Problem 14: Lowest Common Ancestor in Ad Taxonomy Category Tree", "category": "DSA & Algorithms", "subCategory": "Binary Tree / Tree Traversal", "difficulty": "Medium", "search_text": "lowest common ancestor in ad taxonomy category tree binary tree / tree traversal adsgency ai organizes ad verticals into a hierarchical taxonomy tree. given the root of a binary taxonomy tree and two category nodes `p` and `q`, find the lowest common ancestor (lca) node of `p` and `q`. the lowest common ancestor is defined between two nodes `p` and `q` as the lowest node in `t` that has both `p` and `q` as descendants (where we allow a node to be a descendant of itself).\n\nrecursive approach:\n1. base cases:\n   - if `root` is `none`, return `none`.\n   - if `root == p` or `root == q`, return `root`.\n2. recursively search left and right subtrees:\n   - `left = lowestcommonancestor(root.left, p, q)`\n   - `right = lowestcommonancestor(root.right, p, q)`\n3. if both `left` and `right` return non-null, `p` and `q` reside in separate branches, so current `root` is their lca!\n4. if only one of `left` or `right` is non-null, return that non-null node.", "html_content": "\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-amz\">Problem Statement</span></h4>\n          <p class=\"body-p\">AdsGency AI organizes ad verticals into a hierarchical taxonomy tree. Given the root of a binary taxonomy tree and two category nodes `p` and `q`, find the lowest common ancestor (LCA) node of `p` and `q`.</p>\n        </div>\n        <div class=\"section-block\">\n          <h4 class=\"sec-title\"><span class=\"badge badge-purple\">Complete Thought Process & Intuition</span></h4>\n          <p class=\"body-p\">The lowest common ancestor is defined between two nodes `p` and `q` as the lowest node in `T` that has both `p` and `q` as descendants (where we allow a node to be a descendant of itself).<br><br>Recursive Approach:<br>1. Base cases:<br>   - If `root` is `None`, return `None`.<br>   - If `root == p` or `root == q`, return `root`.<br>2.
